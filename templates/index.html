<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>本地项目启动器</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f7f8fa;
      --text: #18202a;
      --text-secondary: #68717d;
      --text-tertiary: #9299a3;
      --line: #e2e5e9;
      --line-strong: #d4d8de;
      --accent: #176b57;
      --accent-hover: #105845;
      --accent-soft: #e5f3ee;
      --success: #16805f;
      --success-soft: #e1f3ec;
      --danger: #be3d49;
      --danger-hover: #a82f3b;
      --danger-soft: #fae9eb;
      --warning: #a76412;
      --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 10px 30px rgba(17, 24, 39, .06);
      --shadow-dialog: 0 24px 80px rgba(17, 24, 39, .2);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --focus: 0 0 0 3px rgba(23, 107, 87, .2);
      font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111416;
        --surface: #191d20;
        --surface-raised: #202529;
        --surface-muted: #161a1d;
        --text: #edf0f2;
        --text-secondary: #a7afb7;
        --text-tertiary: #747d86;
        --line: #2b3136;
        --line-strong: #394047;
        --accent: #62c5a7;
        --accent-hover: #78d2b7;
        --accent-soft: #19382f;
        --success: #68caae;
        --success-soft: #18372f;
        --danger: #f0848d;
        --danger-hover: #f5a0a7;
        --danger-soft: #402329;
        --warning: #e5ae68;
        --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 16px 36px rgba(0, 0, 0, .14);
        --shadow-dialog: 0 28px 90px rgba(0, 0, 0, .55);
        --focus: 0 0 0 3px rgba(98, 197, 167, .25);
      }
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 0 32px 56px;
    }

    .topbar {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(23, 107, 87, .18);
      flex: 0 0 auto;
    }

    .brand-mark svg { width: 23px; height: 23px; }
    .brand-copy { min-width: 0; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.02em; }
    .brand p { margin: 5px 0 0; color: var(--text-secondary); font-size: 13px; }

    .button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 8px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--surface);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, transform .15s ease;
    }

    .button:hover:not(:disabled) { border-color: var(--text-tertiary); background: var(--surface-raised); }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .button svg { width: 16px; height: 16px; }

    .button-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .button-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    @media (prefers-color-scheme: dark) { .button-primary { color: #10251f; } }

    .button-danger { color: var(--danger); }
    .button-danger:hover:not(:disabled) { color: var(--danger-hover); border-color: var(--danger); background: var(--danger-soft); }
    .button-ghost { border-color: transparent; background: transparent; }
    .button-ghost:hover:not(:disabled) { border-color: transparent; background: var(--surface-muted); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 12px 0 38px;
    }

    .summary-card {
      min-height: 114px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .summary-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--surface-muted);
      color: var(--text-secondary);
      flex: 0 0 auto;
    }

    .summary-icon.live { color: var(--success); background: var(--success-soft); }
    .summary-icon svg { width: 21px; height: 21px; }
    .summary-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 5px; }
    .summary-value { font-size: 26px; line-height: 1; font-weight: 700; letter-spacing: -.035em; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 15px;
    }

    .section-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.015em; }
    .section-heading p { margin: 5px 0 0; color: var(--text-secondary); font-size: 13px; }
    .refresh-note { color: var(--text-tertiary); font-size: 12px; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
      gap: 16px;
    }

    .project-card {
      min-width: 0;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .project-card:hover { transform: translateY(-1px); border-color: var(--line-strong); }
    .project-card.running { border-color: color-mix(in srgb, var(--success) 34%, var(--line)); }

    .project-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .project-title { min-width: 0; }
    .project-title h3 { margin: 0; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
    .type-line { display: flex; align-items: center; gap: 8px; margin-top: 7px; }

    .type-badge {
      border-radius: 6px;
      padding: 3px 7px;
      color: var(--text-secondary);
      background: var(--surface-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); }
    .status.running { color: var(--success); }
    .status.running::before { background: var(--success); box-shadow: 0 0 0 4px var(--success-soft); }
    .status.stopped { color: var(--text-secondary); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 20px 0;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .metric { min-width: 0; padding: 0 10px; border-right: 1px solid var(--line); }
    .metric:first-child { padding-left: 0; }
    .metric:last-child { padding-right: 0; border-right: 0; }
    .metric dt { margin: 0 0 5px; color: var(--text-tertiary); font-size: 11px; }
    .metric dd { margin: 0; font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .details { display: grid; gap: 10px; }
    .detail-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: start; gap: 8px; font-size: 12px; }
    .detail-label { color: var(--text-tertiary); line-height: 22px; }
    .detail-value {
      margin: 0;
      min-width: 0;
      color: var(--text-secondary);
      background: var(--surface-muted);
      border-radius: 6px;
      padding: 3px 7px;
      line-height: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .project-actions { display: flex; gap: 8px; margin-top: 18px; }
    .project-actions .button { flex: 1; }
    .project-actions .icon-only { flex: 0 0 38px; padding-inline: 8px; }

    .empty {
      min-height: 310px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      padding: 36px;
    }

    .empty-icon { width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
    .empty-icon svg { width: 25px; height: 25px; }
    .empty h3 { margin: 0; font-size: 16px; }
    .empty p { margin: 8px auto 20px; max-width: 390px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }

    .skeleton { min-height: 300px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; } }

    dialog {
      width: min(590px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      color: var(--text);
      background: var(--surface-raised);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      box-shadow: var(--shadow-dialog);
    }

    dialog::backdrop { background: rgba(13, 18, 22, .48); backdrop-filter: blur(3px); }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 23px 24px 18px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-head p { margin: 6px 0 0; color: var(--text-secondary); font-size: 12px; }
    .dialog-body { padding: 22px 24px; overflow: auto; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 22px; }

    .field-grid { display: grid; grid-template-columns: 1fr 150px; gap: 17px; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; font-weight: 650; }
    .field-hint { color: var(--text-tertiary); font-size: 11px; font-weight: 400; }
    .input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 9px 11px;
      color: var(--text);
      background: var(--surface);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input:hover { border-color: var(--text-tertiary); }
    .input:focus { border-color: var(--accent); outline: none; box-shadow: var(--focus); }
    textarea.input { min-height: 82px; resize: vertical; line-height: 1.5; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
    .path-box { padding: 10px 11px; border-radius: 9px; background: var(--surface-muted); color: var(--text-secondary); font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .detected { display: inline-flex; align-items: center; gap: 7px; width: fit-content; border-radius: 999px; padding: 5px 9px; color: var(--accent); background: var(--accent-soft); font-size: 11px; font-weight: 700; }

    .toast-region { position: fixed; z-index: 100; right: 20px; bottom: 20px; display: grid; gap: 10px; pointer-events: none; }
    .toast { max-width: min(390px, calc(100vw - 40px)); padding: 12px 15px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); box-shadow: var(--shadow-dialog); font-size: 13px; line-height: 1.45; animation: toast-in .18s ease-out; }
    .toast.error { border-color: color-mix(in srgb, var(--danger) 48%, var(--line)); color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .shell { padding: 0 16px 36px; }
      .topbar { min-height: 82px; }
      .brand p { display: none; }
      .summary-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 30px; }
      .summary-card { min-height: 82px; padding: 16px 18px; }
      .summary-icon { width: 39px; height: 39px; }
      .summary-value { font-size: 22px; }
      .section-heading { align-items: start; }
      .refresh-note { display: none; }
      .project-card { padding: 17px; }
      .metrics { grid-template-columns: repeat(2, 1fr); gap: 14px 0; }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(3) { padding-left: 0; }
      .field-grid { grid-template-columns: 1fr; gap: 0; }
      .dialog-head, .dialog-body { padding-inline: 18px; }
      .dialog-actions { padding-inline: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3l2 2h6A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="m10 11 4 2-4 2v-4Z"/></svg>
        </div>
        <div class="brand-copy">
          <h1>本地项目启动器</h1>
          <p>统一管理这台电脑上的开发项目</p>
        </div>
      </div>
      <button class="button button-primary" id="add-project" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>添加项目</span>
      </button>
    </header>

    <main>
      <section class="summary-grid" aria-label="项目概览">
        <article class="summary-card">
          <div class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg></div>
          <div><div class="summary-label">项目总数</div><div class="summary-value" id="total-count">—</div></div>
        </article>
        <article class="summary-card">
          <div class="summary-icon live" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5v14l11-7L8 5Z"/></svg></div>
          <div><div class="summary-label">正在运行</div><div class="summary-value" id="running-count">—</div></div>
        </article>
        <article class="summary-card">
          <div class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m14 0h4M1 15h4m14 0h4"/></svg></div>
          <div><div class="summary-label">进程树内存</div><div class="summary-value" id="memory-total">—</div></div>
        </article>
      </section>

      <section aria-labelledby="projects-title">
        <div class="section-heading">
          <div><h2 id="projects-title">我的项目</h2><p>所有运行状态仅保留在本次启动期间</p></div>
          <span class="refresh-note">运行指标每 2 秒刷新</span>
        </div>
        <div id="project-content">
          <div class="project-grid" aria-label="正在加载项目"><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <div class="dialog-head">
        <div><h2 id="dialog-title">确认项目信息</h2><p>自动识别完成后，你可以在保存前修正配置。</p></div>
        <button class="button button-ghost icon-only" id="close-dialog" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label>识别结果</label>
          <span class="detected" id="detector">—</span>
        </div>
        <div class="field">
          <label>项目路径</label>
          <div class="path-box" id="project-path"></div>
          <input type="hidden" name="path" id="path-input">
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="name-input">项目名称</label>
            <input class="input" id="name-input" name="name" maxlength="80" required autocomplete="off">
          </div>
          <div class="field">
            <label for="type-input">项目类型</label>
            <select class="input" id="type-input" name="type" required>
              <option value="npm">npm</option>
              <option value="python">Python</option>
              <option value="static">静态站点</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="command-input">启动命令 <span class="field-hint">支持 {port} 占位符</span></label>
          <textarea class="input" id="command-input" name="command" required spellcheck="false"></textarea>
        </div>
        <div class="field">
          <label for="port-input">端口 <span class="field-hint">允许范围 3000–8999</span></label>
          <input class="input" id="port-input" name="port" type="number" min="3000" max="8999" required inputmode="numeric">
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button" id="cancel-dialog" type="button">取消</button>
        <button class="button button-primary" id="save-project" type="submit">保存项目</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <template id="empty-template">
    <div class="empty">
      <div>
        <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3l2 2h6A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="M12 10v6m-3-3h6"/></svg></div>
        <h3>还没有添加项目</h3>
        <p>选择一个本地文件夹，启动器会自动识别 npm、Python 或静态站点并生成启动命令。</p>
        <button class="button button-primary empty-add" type="button">选择项目文件夹</button>
      </div>
    </div>
  </template>

  <script>
    const icons = {
      play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7L8 5Z"/></svg>',
      stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>',
      open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6m0-6-9 9"/><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>'
    };

    const state = { projects: [], refreshing: false, actionIds: new Set() };
    const content = document.querySelector('#project-content');
    const dialog = document.querySelector('#project-dialog');
    const form = document.querySelector('#project-form');
    const addButton = document.querySelector('#add-project');

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: options.body ? { 'Content-Type': 'application/json', ...(options.headers || {}) } : options.headers
      });
      if (!response.ok) {
        let message = `请求失败（${response.status}）`;
        try {
          const body = await response.json();
          if (body.detail) message = Array.isArray(body.detail) ? body.detail[0]?.msg || message : body.detail;
        } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    function showToast(message, type = '') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.querySelector('#toasts').append(toast);
      window.setTimeout(() => toast.remove(), 3800);
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 MB';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / Math.pow(1024, index);
      return `${value.toFixed(index < 2 ? 0 : 1)} ${units[index]}`;
    }

    function formatDuration(seconds) {
      if (!seconds) return '—';
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const rest = seconds % 60;
      if (hours) return `${hours}时 ${minutes}分`;
      if (minutes) return `${minutes}分 ${rest}秒`;
      return `${rest}秒`;
    }

    function metric(label, value) {
      const wrapper = document.createElement('div');
      wrapper.className = 'metric';
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = label;
      dd.textContent = value;
      dd.title = value;
      wrapper.append(dt, dd);
      return wrapper;
    }

    function detailRow(label, value) {
      const row = document.createElement('div');
      row.className = 'detail-row';
      const name = document.createElement('span');
      name.className = 'detail-label';
      name.textContent = label;
      const text = document.createElement('code');
      text.className = 'detail-value';
      text.textContent = value;
      text.title = value;
      row.append(name, text);
      return row;
    }

    function actionButton(label, action, icon, classes = '') {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `button ${classes}`;
      button.dataset.action = action;
      button.innerHTML = icon;
      const text = document.createElement('span');
      text.textContent = label;
      button.append(text);
      return button;
    }

    function renderCard(project) {
      const running = project.status === 'running';
      const card = document.createElement('article');
      card.className = `project-card ${running ? 'running' : ''}`;
      card.dataset.id = project.id;

      const head = document.createElement('div');
      head.className = 'project-head';
      const title = document.createElement('div');
      title.className = 'project-title';
      const h3 = document.createElement('h3');
      h3.textContent = project.name;
      const typeLine = document.createElement('div');
      typeLine.className = 'type-line';
      const type = document.createElement('span');
      type.className = 'type-badge';
      type.textContent = project.type;
      typeLine.append(type);
      title.append(h3, typeLine);
      const status = document.createElement('span');
      status.className = `status ${project.status}`;
      status.textContent = running ? '运行中' : '已停止';
      head.append(title, status);

      const metrics = document.createElement('dl');
      metrics.className = 'metrics';
      metrics.append(
        metric('端口', String(project.port)),
        metric('PID', project.pid ? String(project.pid) : '—'),
        metric('CPU', running ? `${project.cpu_percent.toFixed(1)}%` : '—'),
        metric('内存', running ? formatBytes(project.memory_bytes) : '—')
      );

      const details = document.createElement('div');
      details.className = 'details';
      details.append(
        detailRow('运行', formatDuration(project.uptime_seconds)),
        detailRow('地址', project.url),
        detailRow('路径', project.path),
        detailRow('命令', project.command)
      );

      const actions = document.createElement('div');
      actions.className = 'project-actions';
      const primary = actionButton(running ? '停止' : '启动', running ? 'stop' : 'start', running ? icons.stop : icons.play, running ? '' : 'button-primary');
      const open = actionButton('打开', 'open', icons.open);
      const remove = actionButton('删除', 'delete', icons.trash, 'button-danger icon-only');
      remove.querySelector('span').remove();
      remove.setAttribute('aria-label', '删除项目');
      remove.title = '删除项目';
      open.disabled = !running;
      remove.disabled = running;
      if (state.actionIds.has(project.id)) {
        primary.disabled = true;
        primary.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>处理中</span>';
      }
      actions.append(primary, open, remove);
      card.append(head, metrics, details, actions);
      return card;
    }

    function render(payload) {
      state.projects = payload.projects;
      document.querySelector('#total-count').textContent = payload.summary.total;
      document.querySelector('#running-count').textContent = payload.summary.running;
      document.querySelector('#memory-total').textContent = formatBytes(payload.summary.total_memory_bytes);
      content.replaceChildren();
      if (!payload.projects.length) {
        content.append(document.querySelector('#empty-template').content.cloneNode(true));
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'project-grid';
      payload.projects.forEach(project => grid.append(renderCard(project)));
      content.append(grid);
    }

    async function refresh(silent = false) {
      if (state.refreshing) return;
      state.refreshing = true;
      try {
        render(await api('/api/projects'));
      } catch (error) {
        if (!silent) showToast(error.message, 'error');
      } finally {
        state.refreshing = false;
      }
    }

    async function beginAdd() {
      const original = addButton.innerHTML;
      addButton.disabled = true;
      addButton.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>选择中</span>';
      try {
        const picked = await api('/api/picker', { method: 'POST' });
        if (!picked.path) return;
        addButton.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>识别中</span>';
        const detected = await api('/api/projects/inspect', {
          method: 'POST',
          body: JSON.stringify({ path: picked.path })
        });
        form.reset();
        document.querySelector('#detector').textContent = detected.detector;
        document.querySelector('#project-path').textContent = detected.path;
        document.querySelector('#path-input').value = detected.path;
        document.querySelector('#name-input').value = detected.name;
        document.querySelector('#type-input').value = detected.type;
        document.querySelector('#command-input').value = detected.command;
        document.querySelector('#port-input').value = detected.port;
        dialog.showModal();
        document.querySelector('#name-input').focus();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        addButton.disabled = false;
        addButton.innerHTML = original;
      }
    }

    async function saveProject(event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const button = document.querySelector('#save-project');
      const original = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>保存中</span>';
      const data = new FormData(form);
      try {
        await api('/api/projects', {
          method: 'POST',
          body: JSON.stringify({
            path: data.get('path'),
            name: data.get('name'),
            type: data.get('type'),
            command: data.get('command'),
            port: Number(data.get('port'))
          })
        });
        dialog.close();
        showToast('项目已添加');
        await refresh(true);
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        button.disabled = false;
        button.innerHTML = original;
      }
    }

    async function handleAction(button) {
      const card = button.closest('.project-card');
      if (!card) return;
      const id = card.dataset.id;
      const action = button.dataset.action;
      const project = state.projects.find(item => item.id === id);
      if (!project) return;
      if (action === 'open') {
        window.open(project.url, '_blank', 'noopener,noreferrer');
        return;
      }
      if (action === 'delete' && !window.confirm(`确定删除“${project.name}”吗？`)) return;

      state.actionIds.add(id);
      render({
        summary: {
          total: state.projects.length,
          running: state.projects.filter(item => item.status === 'running').length,
          total_memory_bytes: state.projects.reduce((sum, item) => sum + item.memory_bytes, 0)
        },
        projects: state.projects
      });
      try {
        if (action === 'delete') {
          await api(`/api/projects/${id}`, { method: 'DELETE' });
          showToast('项目已删除');
        } else {
          await api(`/api/projects/${id}/${action}`, { method: 'POST' });
          showToast(action === 'start' ? '项目已启动' : '项目已停止');
        }
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        state.actionIds.delete(id);
        await refresh(true);
      }
    }

    addButton.addEventListener('click', beginAdd);
    content.addEventListener('click', event => {
      if (event.target.closest('.empty-add')) beginAdd();
      const action = event.target.closest('[data-action]');
      if (action) handleAction(action);
    });
    form.addEventListener('submit', saveProject);
    document.querySelector('#close-dialog').addEventListener('click', () => dialog.close());
    document.querySelector('#cancel-dialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refresh(true);
    });

    refresh();
    window.setInterval(() => {
      if (!document.hidden) refresh(true);
    }, 2000);
  </script>
</body>
</html>
